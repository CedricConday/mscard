[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mscard"
version = "0.1.0"
description = "Longitudinal multiple sclerosis MRI report that grades itself: new, enlarging, resolved and slowly expanding lesions, brain volume change, and a calibration of the same pipeline on the same scan with known injected truth."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["multiple sclerosis", "MRI", "longitudinal", "lesion", "atrophy", "calibration", "report"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5",
  "pandas>=2",
  "matplotlib>=3.7",
  "lesiontrack>=0.2.0",
  "bidsgate>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build", "fhir.resources>=7"]
fhir = ["fhir.resources>=7"]

[project.urls]
Homepage = "https://github.com/CedricConday/mscard"

[project.scripts]
mscard = "mscard.cli:main"

[tool.setuptools.packages.find]
include = ["mscard*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
